# ═══════════════════════════════════════════════════════════
#  SGCE — Netlify Configuration
#  Seguridad, rutas y funciones.
# ═══════════════════════════════════════════════════════════

[build]
  publish   = "public"
  functions = "netlify/functions"
  command   = "node inject-env.js"

[build.environment]
  NODE_VERSION            = "20"
  SECRETS_SCAN_OMIT_PATHS = "public/firebase-config.js,netlify/functions/firebase-config.mjs"

# ── Las funciones usan ES Modules ────────────────────────────
[functions]
  node_bundler = "esbuild"

# ── /api/groq → function groq.js ────────────────────────────
[[redirects]]
  from   = "/api/groq"
  to     = "/.netlify/functions/groq"
  status = 200
  force  = true

# ── URLs cortas para el manifest y el ícono PWA ─────────────
[[redirects]]
  from   = "/pwa-manifest"
  to     = "/.netlify/functions/pwa-manifest"
  status = 200
  force  = true

[[redirects]]
  from   = "/pwa-icon"
  to     = "/.netlify/functions/pwa-icon"
  status = 200
  force  = true

# ── /api/register-demo → function register-demo.js ──────────
[[redirects]]
  from   = "/api/register-demo"
  to     = "/.netlify/functions/register-demo"
  status = 200
  force  = true

# ── /api/registrar-curso → function registrar-curso.js ──────
[[redirects]]
  from   = "/api/registrar-curso"
  to     = "/.netlify/functions/registrar-curso"
  status = 200
  force  = true

# ── /api/verificar-curso → function verificar-curso.js ──────
[[redirects]]
  from   = "/api/verificar-curso"
  to     = "/.netlify/functions/verificar-curso"
  status = 200
  force  = true

# ── /api/registrar-curso-apoderados → function ─────────────
[[redirects]]
  from   = "/api/registrar-curso-apoderados"
  to     = "/.netlify/functions/registrar-curso-apoderados"
  status = 200
  force  = true

# ── /api/registrar-formacion → function registrar-formacion.js ──
[[redirects]]
  from   = "/api/registrar-formacion"
  to     = "/.netlify/functions/registrar-formacion"
  status = 200
  force  = true

# ── Formación: editor (URL amable) antes del catch-all de entrega ──
[[redirects]]
  from   = "/formacion/editor"
  to     = "/formacion/editor.html"
  status = 200

# ── Tarjeta de Convivencia (admin): URL limpia → .html (conserva subdominio/tenant) ──
[[redirects]]
  from   = "/tarjetadeconvivencia"
  to     = "/tarjetadeconvivencia.html"
  status = 200

# ── Tienda de Convivencia (pública): URL limpia + backend de compra ──
[[redirects]]
  from   = "/tienda"
  to     = "/tienda.html"
  status = 200

[[redirects]]
  from   = "/api/tc-tienda"
  to     = "/.netlify/functions/tc-tienda"
  status = 200

# ── Descargos del apoderado (suspensiones): URL limpia → .html ──
[[redirects]]
  from   = "/descargos"
  to     = "/descargos.html"
  status = 200

# ── Formación: /formacion/{cursoId} → entrega (conserva subdominio/tenant) ──
[[redirects]]
  from   = "/formacion/*"
  to     = "/formacion/index.html?c=:splat"
  status = 200

# ── Curso de apoderados: /apoderados → carpeta apoderados/index.html ─────
#    (rewrite status 200: conserva el subdominio/tenant y la URL limpia)
[[redirects]]
  from   = "/apoderados"
  to     = "/apoderados/index.html"
  status = 200

# Rutas antiguas (diplomas ya emitidos, enlaces previos): redirigen a la nueva
[[redirects]]
  from   = "/curso-apoderados"
  to     = "/apoderados/index.html"
  status = 200

[[redirects]]
  from   = "/curso_apoderados"
  to     = "/apoderados/index.html"
  status = 200

# ═══════════════════════════════════════════════════════════
#  CABECERAS DE SEGURIDAD
# ═══════════════════════════════════════════════════════════
[[headers]]
  for = "/*"

  [headers.values]
    X-Frame-Options            = "DENY"
    X-Content-Type-Options     = "nosniff"
    Referrer-Policy            = "strict-origin-when-cross-origin"
    Strict-Transport-Security  = "max-age=31536000; includeSubDomains; preload"
    Permissions-Policy         = "camera=(), microphone=(), geolocation=(), payment=()"
    # manifest-src incluye 'self' para las URLs reales de las funciones (sin blob:)
    Content-Security-Policy    = "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: blob: https://firebasestorage.googleapis.com; font-src 'self' https://cdnjs.cloudflare.com; connect-src 'self' https://*.firebaseio.com https://*.googleapis.com https://www.gstatic.com https://api.groq.com wss://*.firebaseio.com https://formspree.io; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://formspree.io; manifest-src 'self'; worker-src 'self';"

# ── Service Worker: sin caché para que siempre sea fresco ───
[[headers]]
  for = "/sw.js"

  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# ── HTML: revalidar siempre (evita servir versiones viejas tras un deploy) ──
#    "no-cache" no impide cachear: obliga a revalidar con ETag (304 si no cambió).
[[headers]]
  for = "/"

  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/*.html"

  [headers.values]
    Cache-Control = "no-cache"

# ── Funciones PWA: CORS abierto (iconos deben ser accesibles cross-origin) ──
[[headers]]
  for = "/.netlify/functions/pwa-icon"

  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Cache-Control                = "public, s-maxage=21600, max-age=3600"

[[headers]]
  for = "/.netlify/functions/pwa-manifest"

  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "GET, OPTIONS"
    Content-Type                 = "application/manifest+json"
    Cache-Control                = "public, s-maxage=21600, max-age=3600"

[[headers]]
  for = "/pwa-icon"

  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Cache-Control                = "public, s-maxage=21600, max-age=3600"

[[headers]]
  for = "/pwa-manifest"

  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Content-Type                 = "application/manifest+json"
    Cache-Control                = "public, s-maxage=21600, max-age=3600"

[[headers]]
  for = "/.netlify/functions/register-demo"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/.netlify/functions/registrar-curso"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/.netlify/functions/verificar-curso"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/.netlify/functions/registrar-curso-apoderados"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/.netlify/functions/registrar-formacion"
  [headers.values]
    Access-Control-Allow-Origin  = "*"
    Access-Control-Allow-Methods = "POST, OPTIONS"
    Access-Control-Allow-Headers = "Content-Type"

[[headers]]
  for = "/.netlify/functions/*"

  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options        = "DENY"
